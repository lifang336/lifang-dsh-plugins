# 这个文件是「bundle 层」：当本包被正式安装到某个 profile 后，
# profile 的 package.json 里 dsh.profile.bundles 会列出本包，
# 加载器就会读取 package.json 的 dsh.bundle.patch 指向的这个文件，
# 把下面的 insert 行叠加到配置树上。
#
# 顶层必须是 YAML 数组。每个元素的形态：
#   { id, name, config }  覆盖已有行的配置（id + name 双匹配，config 整体替换不合并）
#   { id, disabled }      启停某一行
#   { insert: [...] }     插入新行
- insert:
    - id: hello-dsh
      name: dsh-plugin-hello
      config:
        greeting: 你好
        upperCase: false
