# 开发期用的 overlay，不写进任何 profile 配置。
#
# 用法（--patch 的路径会被锚定，name 里的相对路径相对本文件解析）：
#   dsh --profile headless --patch ~/code/dsh-plugins/plugins/hello-dsh/dev.patch.yml "<任务>"
#
# 因为 name 直接指向源文件，改代码不需要重新安装，也不需要打包。
- insert:
    - id: hello-dsh-dev
      name: ./lib/index.js
      config:
        greeting: 你好
        upperCase: false
